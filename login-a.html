<body class="a-review a-login" data-demo-design="a" data-demo-page="login">
    <header class="a-header">
        <a href="main-a.html" aria-label="Macnica Cytech home"><img class="a-company" src="images/logo/macnica-cytech.svg" alt="Macnica Cytech"></a>
        <nav class="a-designs" aria-label="Design review">
            <span>Review</span>
    <a href="login-g.html">G</a>

<a href="#" rel="noopener" data-demo-unavailable="" aria-disabled="true" title="Unavailable in layout review">Current</a>
        </nav>
    </header>
    <main class="a-signin">
        <a class="a-signin-brand" href="#" data-demo-unavailable="" aria-disabled="true" title="Unavailable in layout review"><img src="images/logo/logo1.png" alt="WMS, Macnica Cytech - About Us"></a>
        <div class="a-signin-heading"><span class="a-eyebrow">WAREHOUSE MANAGEMENT</span><h1>Sign in</h1></div>
        <form action="#" method="post" data-login-form="">
            
            <label for="a-user">Username</label>
            <input id="a-user" value="" autocomplete="username" required="" autofocus="">
            <label for="a-password">Password</label>
            <div class="a-password"><input id="a-password" type="password" autocomplete="current-password" required=""><button type="button" data-password-toggle="" aria-label="Show password" title="Show password"><i data-lucide="eye" aria-hidden="true"></i></button></div>
            <label for="a-environment">Environment</label>
            <select id="a-environment" name="Login.ConnectionName" data-environment="">
                <option value="UAT" selected="selected">UAT</option>
                <option value="EBSPROD">PROD</option>
            </select>
            <div class="a-production" data-production="" hidden="hidden"><i data-lucide="shield-alert" aria-hidden="true"></i>Production environment</div>
            <button type="submit" class="a-primary a-signin-submit"><span>Sign in</span><i data-lucide="arrow-right" aria-hidden="true"></i></button>
            <a class="a-reset" href="#" rel="noopener" data-demo-unavailable="" aria-disabled="true" title="Unavailable in layout review">Reset password via Oracle EBS <i data-lucide="external-link" aria-hidden="true"></i></a>
        </form>
    </main>

<body class="e-review e-login" data-demo-design="e" data-demo-page="login">
    <header class="e-header">
        <a href="main-e.html"><img class="e-company" src="images/logo/macnica-cytech.svg" alt="Macnica Cytech home"></a>
        <nav class="e-review-links" aria-label="Design review">

<a href="#" rel="noopener" data-demo-unavailable="" aria-disabled="true" title="Unavailable in layout review">Current</a>
        </nav>
    </header>
    <main class="e-signin">
        <a class="e-signin-logo" href="#" data-demo-unavailable="" aria-disabled="true" title="Unavailable in layout review"><img src="images/logo/logo1.png" alt="WMS - About Us"></a>
        <div class="e-signin-heading"><span class="e-eyebrow">MACNICA CYTECH</span><h1>Welcome back.</h1><p>Warehouse Management System</p></div>
        <form action="#" method="post" data-login-form="">
            
            <label for="e-user">Username</label>
            <input id="e-user" value="" autocomplete="username" required="" autofocus="">
            <label for="e-password">Password</label>
            <div class="e-password"><input id="e-password" type="password" autocomplete="current-password" required=""><button type="button" class="e-icon" data-password-toggle="" aria-label="Show password" title="Show password"><i data-lucide="eye" aria-hidden="true"></i></button></div>
            <label for="e-environment">Environment</label>
            <select id="e-environment" name="Login.ConnectionName" data-environment="">
                <option value="UAT" selected="selected">UAT</option>
                <option value="EBSPROD">PROD</option>
            </select>
            <p class="e-production" data-production="" hidden="hidden"><i data-lucide="shield-alert" aria-hidden="true"></i> Production environment</p>
            <button type="submit" class="e-primary e-signin-submit"><span>Sign in</span><i data-lucide="arrow-right" aria-hidden="true"></i></button>
            <a class="e-password-reset" href="#" rel="noopener" data-demo-unavailable="" aria-disabled="true" title="Unavailable in layout review">Reset password via Oracle EBS <i data-lucide="external-link" aria-hidden="true"></i></a>
        </form>
    </main>
